*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one full-bleed night-garden canvas; prose captions rise from the fallen white at the bottom; controls float at the top. */
:root{
  color-scheme: dark;
  --night:#0b1513;
  --ink:#f3efe6;
  --ink-dim:rgba(243,239,230,.64);
  --line:rgba(243,239,230,.28);
  --pollen:#f0c25a;
  --glass:rgba(10,22,19,.5);
  --display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --body:'LXGW WenKai TC','Kaiti TC','DFKai-SB','BiauKai',serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.scrim{position:fixed;left:0;right:0;bottom:0;height:60%;pointer-events:none;
  background:linear-gradient(to top,rgba(5,10,9,.82),rgba(5,10,9,.45) 45%,transparent)}
.bar{position:fixed;left:0;right:0;top:0;height:2px;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.bar i{display:block;height:2px;width:0;background:var(--pollen);opacity:.75;transition:width .3s linear}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chap{font-family:var(--display);font-size:1.64rem;letter-spacing:.32em;color:var(--ink-dim);transition:opacity .8s}
.chap b{color:var(--pollen);font-weight:500;margin-right:.6em}
.ctrls{display:flex;gap:8px;pointer-events:auto}
.ic{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic:focus-visible,.btn:focus-visible{outline:2px solid var(--pollen);outline-offset:3px}
.cap{max-width:20em;margin:0 auto;text-align:center;font-size:clamp(1.9rem,7.6vw,3rem);line-height:1.6;letter-spacing:.02em;
  text-wrap:balance;text-shadow:0 1px 14px rgba(0,0,0,.75);opacity:0;transform:translateY(8px);transition:opacity 1s ease,transform 1s ease;min-height:3.6em;
  display:flex;align-items:flex-end;justify-content:center}
.cap.on{opacity:1;transform:none}
.intro,.endcard{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);text-align:center;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px);
  background:radial-gradient(ellipse at center,rgba(6,12,11,.55),rgba(6,12,11,.15) 70%);transition:opacity 1.2s}
.intro.gone,.endcard.gone{opacity:0;pointer-events:none}
.titlewrap{display:flex;gap:18px;align-items:flex-start}
.title{writing-mode:vertical-rl;font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,min(11vw,7.2vh),4.2rem);letter-spacing:.22em;
  text-shadow:0 2px 24px rgba(0,0,0,.6)}
.sub{writing-mode:vertical-rl;font-family:var(--body);font-size:clamp(1rem,min(4.6vw,3vh),1.4rem);letter-spacing:.3em;color:var(--ink-dim);padding-top:2.4em}
.latin{font-family:var(--display);font-style:italic;font-size:clamp(.95rem,4.2vw,1.25rem);white-space:nowrap;letter-spacing:.08em;color:var(--ink-dim)}
.btn{font-family:var(--body);font-size:clamp(1.15rem,5.4vw,1.5rem);white-space:nowrap;letter-spacing:.2em;color:#1b160a;background:var(--pollen);border:0;border-radius:999px;

.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hint{font-size:clamp(.95rem,4.2vw,1.2rem);color:var(--ink-dim);letter-spacing:.08em;line-height:1.8}
.endline{font-family:var(--display);font-size:clamp(1.5rem,6.4vw,2.4rem);letter-spacing:.2em;text-wrap:balance}

function makeFlower(){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.translate(64,64);
  for(let i=0;i<120;i++){
    const a=rnd(0,Math.PI*2),l=rnd(20,58)*(.7+.3*Math.abs(Math.sin(a+.6)));
    x.strokeStyle=`rgba(255,252,244,${rnd(.45,.92)})`;x.lineWidth=rnd(.5,1.05);
    x.beginPath();x.moveTo(Math.cos(a)*5,Math.sin(a)*5);
    x.quadraticCurveTo(Math.cos(a+.1)*l*.55,Math.sin(a+.1)*l*.55,Math.cos(a)*l,Math.sin(a)*l);x.stroke();
    x.fillStyle=Math.random()<.75?`rgba(255,${rnd(165,210)|0},${rnd(192,222)|0},.95)`:'rgba(255,236,170,.9)';
    x.beginPath();x.arc(Math.cos(a)*l,Math.sin(a)*l,rnd(1.1,2),0,7);x.fill();
  }
  const rg=x.createRadialGradient(0,0,0,0,0,12);rg.addColorStop(0,'rgba(230,240,200,.95)');rg.addColorStop(1,'rgba(230,240,200,0)');
  x.fillStyle=rg;x.beginPath();x.arc(0,0,12,0,7);x.fill();
  return c;
}
function makeCanopy(){
  const h=Math.round(H*.3),c=document.createElement('canvas');c.width=W*DPR;c.height=h*DPR;const x=c.getContext('2d');x.scale(DPR,DPR);
  const n=Math.round(W*.45);
  for(let i=0;i<n;i++){
    const yy=Math.pow(Math.random(),1.6)*h*.92,rx=rnd(12,34),L=rnd(5,15);
    x.fillStyle=`hsla(${rnd(128,150)|0},${rnd(25,40)|0}%,${L}%,${rnd(.55,.9)})`;
    x.beginPath();x.ellipse(rnd(-30,W+30),yy-10,rx,rx*rnd(.32,.5),rnd(-.8,.8),0,7);x.fill();
  }
  return c;
}
function makeGrass(){
  const h=Math.ceil(H-GT),c=document.createElement('canvas');c.width=W*DPR;c.height=h*DPR;const x=c.getContext('2d');x.scale(DPR,DPR);
  const lg=x.createLinearGradient(0,0,0,h);lg.addColorStop(0,'#13261b');lg.addColorStop(1,'#0c1a12');x.fillStyle=lg;x.fillRect(0,0,W,h);
  const n=Math.round(W*h*.06);
  for(let i=0;i<n;i++){
    const px=rnd(0,W),py=rnd(0,h),d=py/h,len=rnd(3,12)*(.5+d);
    x.strokeStyle=`hsla(${rnd(95,135)|0},${rnd(25,45)|0}%,${rnd(14,30)|0}%,.8)`;x.lineWidth=.6+d*.8;
    x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+rnd(-2,2),py-len*.6,px+rnd(-4,4),py-len);x.stroke();
  }
  return c;
}
function makeStrands(){
  strands=[];const N=Math.max(7,Math.round(W/52));
  for(let i=0;i<N;i++){
    const ay=rnd(H*.08,H*.2),len=Math.min(rnd(.3,.58)*H,GT-ay-H*.06);
    const bn=Math.max(6,Math.floor(len/14)),beads=[];
    for(let k=0;k<bn;k++)beads.push({s:(k+1)/bn,seed:Math.random(),bloom:0,present:true,regrow:0,sz:rnd(.75,1.12),spr:(Math.random()*3)|0});
    strands.push({ax:(i+rnd(.15,.85))*W/N,ay,len,amp:rnd(6,16),sp:rnd(.5,.95),ph:rnd(0,6.3),beads,fruit:Math.random()<.65,fs:rnd(7,10),shake:0});
  }
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;GT=H*.72;
  groundCv=document.createElement('canvas');groundCv.width=W*DPR;groundCv.height=Math.ceil(H-GT)*DPR;gx=groundCv.getContext('2d');gx.scale(DPR,DPR);
  grassCv=makeGrass();canopyCv=makeCanopy();makeStrands();parts.length=0;snow.length=0;
}
SPR=[makeFlower(),makeFlower(),makeFlower()];

/* ---------- state ---------- */
let mode='intro',playing=true,T=0,time=0,curLine=-1,wind=0,snowAcc=0,photoK=0;
const parts=[],bees=[],motes=[],snow=[],ripples=[];

function sp(st,s){
  const sw=Math.sin(time*.7*st.sp+st.ph+s*2.3)*st.amp*s*s+wind*s*s+Math.sin(time*9)*st.shake*s*10;
  return [st.ax+sw,st.ay+s*st.len];
}
function bloomed(){
  const st=strands[(Math.random()*strands.length)|0];if(!st)return null;
  const c=st.beads.filter(b=>b.present&&b.bloom>.55);if(!c.length)return null;
  return {st,b:c[(Math.random()*c.length)|0]};
}
function drop(st,b,kick){
  const [x,y]=sp(st,b.s);b.present=false;b.regrow=time+rnd(7,16);
  if(parts.length>260)return;
  parts.push({x,y,vx:rnd(-8,8)+(kick||0),vy:rnd(0,8),r:rnd(0,6.3),vr:rnd(-1.5,1.5),sz:(10+28*b.bloom)*b.sz,spr:b.spr,
    ty:GT+Math.pow(Math.random(),.75)*(H-GT-4)});
}
function stamp(x,y,spr,big){
  const d=(y-GT)/(H-GT),s=(8+20*d)*(big||1);
  gx.save();gx.globalAlpha=.55+.35*d;gx.translate(x,y-GT);gx.scale(1,.55);gx.rotate(rnd(0,6.3));
  gx.drawImage(SPR[spr],-s/2,-s/2,s,s);gx.restore();
}

/* ---------- update ---------- */
function target(k){
  let sc,li=0;
  if(mode==='intro')sc=PREVIEW;else if(mode==='end')sc=SC[4],li=9;else{const L=LINES[Math.max(0,curLine)];sc=SC[L.si];li=L.li;}
  if(k==='bg')return sc.bg;
  const v=sc[k];return Array.isArray(v)?v[Math.min(li,v.length-1)]:(v||0);
}
function update(dt){
  time+=dt;
  if(mode==='play'&&playing){
    T+=dt;
    let li=LINES.findIndex(L=>T>=L.t0&&T<L.t0+L.dur);
    if(T>=TOTAL){mode='end';showEnd();}
    else if(li>=0&&li!==curLine){curLine=li;showLine(LINES[li]);}
    prog.style.width=(Math.min(1,T/TOTAL)*100)+'%';
  }
  const k=Math.min(1,dt*.55);
  KEYS.forEach(key=>{const r=key==='photo'?dt*.3:k;P[key]+=(target(key)-P[key])*Math.min(1,r);});
  const bg=target('bg'),a=hex(bg[0]),b=hex(bg[1]);
  for(let i=0;i<3;i++){P.bgA[i]+=(a[i]-P.bgA[i])*k*.6;P.bgB[i]+=(b[i]-P.bgB[i])*k*.6;}
  wind=Math.sin(time*.27)*7+Math.sin(time*.91)*3;
  const m=reduce?.4:1;

  for(const st of strands){
    st.shake*=Math.pow(.2,dt);
    for(const bd of st.beads){
      if(!bd.present){if(time>bd.regrow){bd.present=true;bd.bloom=0;}continue;}
      const tg=P.bloom>bd.seed?1:0;bd.bloom+=(tg-bd.bloom)*Math.min(1,dt*.5);
    }
  }
  // falling blossoms
  let n=P.fall*dt*6*m;while(n>0){if(Math.random()<n){const o=bloomed();if(o)drop(o.st,o.b);}n-=1;}
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.vy=Math.min(p.vy+26*dt,46);p.vx+=(wind*.6-p.vx)*dt*.6;
    p.x+=(p.vx+Math.sin(time*2+p.r)*6)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
    if(p.y>=p.ty){stamp(p.x,p.y,p.spr);parts.splice(i,1);plink();}
  }
  // snow
  n=P.snow*dt*45*m;while(n>0){if(Math.random()<n&&snow.length<400)snow.push({x:rnd(-20,W+20),y:-6,vy:rnd(16,34),r:rnd(.7,2.3),ph:rnd(0,6.3),ty:GT+Math.random()*(H-GT)});n-=1;}
  for(let i=snow.length-1;i>=0;i--){const s=snow[i];s.y+=s.vy*dt;s.x+=(Math.sin(time*.8+s.ph)*10+wind*.5)*dt;
    if(s.y>=s.ty){gx.fillStyle='rgba(250,250,255,.7)';gx.beginPath();gx.arc(s.x,s.y-GT,s.r*.8,0,7);gx.fill();snow.splice(i,1);}}
  snowAcc+=((P.snow>.3?.42:0)-snowAcc)*dt*(P.snow>.3?.08:.03);
  // ripples
  if(Math.random()<P.ripple*dt*.6)ripples.push({x:rnd(W*.1,W*.9),y:rnd(GT+10,H-10),r:2,life:1});
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=dt*(40+r.r*.4);r.life-=dt*.32;if(r.life<=0)ripples.splice(i,1);}
  // scent motes
  n=P.scent*dt*22*m;while(n>0){if(Math.random()<n){const o=bloomed();if(o){const[x,y]=sp(o.st,o.b.s);motes.push({x,y,vx:rnd(-8,8),vy:rnd(-14,-3),life:rnd(3,5.5),l0:0});}}n-=1;}
  for(let i=motes.length-1;i>=0;i--){const q=motes[i];q.l0+=dt;q.x+=(q.vx+wind*.7+Math.sin(time+q.y*.02)*8)*dt;q.y+=q.vy*dt;if(q.l0>q.life)motes.splice(i,1);}
  // bees
  const want=Math.round(P.bees+.2);let active=bees.filter(b=>!b.leave).length;
  while(active<want){const L=Math.random()<.5;bees.push({x:L?-20:W+20,y:rnd(H*.2,H*.6),vx:0,vy:0,ph:rnd(0,6.3),tgt:null,hold:0,trail:[],leave:false});active++;}
  if(active>want){const b=bees.find(b=>!b.leave);if(b){b.leave=true;b.tgt=null;}}
  for(let i=bees.length-1;i>=0;i--){
    const b=bees[i];let tx,ty;
    if(b.leave){tx=b.x<W/2?-60:W+60;ty=b.y-40;}
    else{
      if(!b.tgt||!b.tgt.b.present||b.hold>rnd(1.5,3.5)){b.tgt=bloomed();b.hold=0;}
      if(b.tgt){[tx,ty]=sp(b.tgt.st,b.tgt.b.s);ty-=6;}else{tx=W/2+Math.sin(time*.4+b.ph)*W*.3;ty=H*.35;}
    }
    const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1;
    if(d<14&&!b.leave)b.hold+=dt;
    const spd=Math.min(95,d*1.6)+12,wob=Math.sin(time*6+b.ph)*35;
    b.vx+=((dx/d)*spd-(dy/d)*wob-b.vx)*Math.min(1,dt*2.4);b.vy+=((dy/d)*spd+(dx/d)*wob-b.vy)*Math.min(1,dt*2.4);
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.trail.push(b.x,b.y);if(b.trail.length>90)b.trail.splice(0,2);
    if(b.leave&&(b.x<-50||b.x>W+50))bees.splice(i,1);
  }
  if(AU.on)AU.hum.gain.setTargetAtTime(AU.muted?0:Math.min(1,bees.length/10)*.022,AU.C.currentTime,.4);
}

/* ---------- draw ---------- */
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,rgb(P.bgA));bg.addColorStop(1,rgb(P.bgB));g.fillStyle=bg;g.fillRect(0,0,W,H);
  if(P.moon>.01){const mx=W*.78,my=H*.2,mg=g.createRadialGradient(mx,my,0,mx,my,90);
    mg.addColorStop(0,`rgba(255,248,226,${.85*P.moon})`);mg.addColorStop(.18,`rgba(255,244,214,${.55*P.moon})`);mg.addColorStop(.2,`rgba(255,244,214,${.14*P.moon})`);mg.addColorStop(1,'rgba(255,244,214,0)');
    g.fillStyle=mg;g.beginPath();g.arc(mx,my,90,0,7);g.fill();}
  if(P.photo>.01&&img.complete&&img.naturalWidth){
    photoK+=1/60/40;const s=Math.max(W/img.naturalWidth,H/img.naturalHeight)*(1.04+Math.min(.08,photoK*.08));
    const iw=img.naturalWidth*s,ih=img.naturalHeight*s;g.globalAlpha=P.photo*.92;g.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih);g.globalAlpha=1;
  }
  const fade=1-P.photo*.78;
  // ground
  g.globalAlpha=fade;g.drawImage(grassCv,0,GT,W,H-GT);g.drawImage(groundCv,0,GT,W,H-GT);
  if(snowAcc>.005){const sg=g.createLinearGradient(0,GT,0,H);sg.addColorStop(0,`rgba(235,242,250,${snowAcc*.5})`);sg.addColorStop(1,`rgba(245,248,255,${snowAcc})`);g.fillStyle=sg;g.fillRect(0,GT,W,H-GT);}
  const hz=g.createLinearGradient(0,GT-30,0,GT+30);hz.addColorStop(0,'rgba(0,0,0,0)');hz.addColorStop(.5,`rgba(${P.bgB[0]|0},${P.bgB[1]|0},${P.bgB[2]|0},.55)`);hz.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=hz;g.fillRect(0,GT-30,W,60);
  // ripples
  for(const r of ripples){g.strokeStyle=`rgba(232,240,255,${r.life*.55})`;g.lineWidth=1.1;g.beginPath();g.ellipse(r.x,r.y,r.r,r.r*.28,0,0,7);g.stroke();}
  // strands
  for(const st of strands){
    g.strokeStyle='rgba(150,185,120,.45)';g.lineWidth=.9;g.beginPath();
    for(let s=0;s<=1.0001;s+=.05){const[x,y]=sp(st,s);s?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();
    for(const b of st.beads){if(!b.present)continue;const[x,y]=sp(st,b.s);
      if(b.bloom<.45){g.globalAlpha=fade*(1-b.bloom*1.6);g.fillStyle='#c6daa9';g.beginPath();g.arc(x,y,2.3*b.sz,0,7);g.fill();}
      if(b.bloom>.15){const sz=(10+28*b.bloom)*b.sz;g.globalAlpha=fade*Math.min(1,(b.bloom-.15)*2);g.drawImage(SPR[b.spr],x-sz/2,y-sz/2,sz,sz);}
      g.globalAlpha=fade;}
    if(st.fruit&&P.fruit>.02){const[x,y]=sp(st,1.04);const f=st.fs;g.save();g.translate(x,y+f*.6);g.globalAlpha=fade*P.fruit;
      g.fillStyle='#5f8a45';g.beginPath();g.moveTo(0,-f);g.lineTo(f*.62,0);g.lineTo(0,f*1.1);g.lineTo(-f*.62,0);g.closePath();g.fill();
      g.strokeStyle='rgba(205,230,170,.55)';g.lineWidth=.8;g.beginPath();g.moveTo(0,-f);g.lineTo(0,f*1.1);g.stroke();g.restore();g.globalAlpha=fade;}
  }
  g.drawImage(canopyCv,0,0,W,H*.3);g.globalAlpha=1;
  // falling
  for(const p of parts){g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=.95;g.drawImage(SPR[p.spr],-p.sz/2,-p.sz/2,p.sz,p.sz);g.restore();}
  // motes
  for(const q of motes){const a=Math.sin(Math.PI*q.l0/q.life)*.7;g.fillStyle=`rgba(255,226,150,${a})`;g.beginPath();g.arc(q.x,q.y,1.4,0,7);g.fill();}
  // bees
  for(const b of bees){
    const tr=b.trail;g.lineWidth=1;
    for(let i=2;i<tr.length;i+=2){g.strokeStyle=`rgba(255,210,120,${(i/tr.length)*.38})`;g.beginPath();g.moveTo(tr[i-2],tr[i-1]);g.lineTo(tr[i],tr[i+1]);g.stroke();}
    g.save();g.translate(b.x,b.y);g.rotate(Math.atan2(b.vy,b.vx));
    const fl=Math.abs(Math.sin(time*42+b.ph));g.fillStyle='rgba(225,238,255,.6)';
    g.beginPath();g.ellipse(-1,-3,3.4,1.6*fl+.4,-.5,0,7);g.fill();g.beginPath();g.ellipse(-1,3,3.4,1.6*fl+.4,.5,0,7);g.fill();
    g.fillStyle='#eab43e';g.beginPath();g.ellipse(0,0,4.4,2.6,0,0,7);g.fill();
    g.fillStyle='#3b2a10';g.fillRect(-1.6,-2.4,1.1,4.8);g.fillRect(.9,-2.2,1.1,4.4);g.restore();
  }
  // snowflakes
  for(const s of snow){g.fillStyle='rgba(250,252,255,.85)';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();}
  // vignette
  const vg=g.createRadialGradient(W/2,H*.45,Math.min(W,H)*.3,W/2,H*.5,Math.max(W,H)*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=vg;g.fillRect(0,0,W,H);
}

/* ---------- audio: generated live in the page ---------- */
const AU={on:false,muted:false,lastPl:0};
const mtof=m=>440*Math.pow(2,(m-69)/12),PENTA=[0,2,4,7,9];
const note=i=>{const o=Math.floor(i/5),k=((i%5)+5)%5;return 62+o*12+PENTA[k];};
function impulse(C,sec,dec){const n=C.sampleRate*sec,b=C.createBuffer(2,n,C.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec);}return b;}
function audioInit(){
  const C=new(window.AudioContext||window.webkitAudioContext)();AU.C=C;
  const comp=C.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(C.destination);
  const master=C.createGain();master.gain.value=0;master.gain.setTargetAtTime(.9,C.currentTime,1.5);master.connect(comp);AU.master=master;
  const rev=C.createConvolver();rev.buffer=impulse(C,3.8,2.3);const wet=C.createGain();wet.gain.value=.65;rev.connect(wet);wet.connect(master);
  const bus=C.createGain();bus.connect(master);bus.connect(rev);AU.bus=bus;
  const pad=C.createGain();pad.gain.value=.8;pad.connect(master);const pw=C.createGain();pw.gain.value=1.2;pad.connect(pw);pw.connect(rev);AU.pad=pad;
  const hum=C.createGain();hum.gain.value=0;const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=460;bp.Q.value=2.5;bp.connect(hum);hum.connect(master);AU.hum=hum;
  [166,249].forEach((f,i)=>{const o=C.createOscillator();o.type='sawtooth';o.frequency.value=f;const l=C.createOscillator();l.frequency.value=7+i*2.3;const lg=C.createGain();lg.gain.value=4;l.connect(lg);lg.connect(o.frequency);const og=C.createGain();og.gain.value=i?.4:1;o.connect(og);og.connect(bp);o.start();l.start();});
  AU.next=C.currentTime+.4;AU.step=0;AU.mel=7;AU.on=true;setInterval(tick,60);
}
function bell(m,when,vel,dec){
  const C=AU.C,f=mtof(m),out=C.createGain();
  out.gain.setValueAtTime(0,when);out.gain.linearRampToValueAtTime(vel*.2,when+.005);out.gain.exponentialRampToValueAtTime(.0004,when+dec);out.connect(AU.bus);
  [[1,1],[2.01,.22],[4,.08]].forEach(([r,a])=>{const o=C.createOscillator();o.frequency.value=f*r;const og=C.createGain();og.gain.value=a;o.connect(og);og.connect(out);o.start(when);o.stop(when+dec+.1);});
}
function padChord(ms,when,dur){
  const C=AU.C;ms.forEach(m=>{const o=C.createOscillator();o.type='triangle';o.frequency.value=mtof(m);o.detune.value=rnd(-7,7);
    const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=720;const gn=C.createGain();
    gn.gain.setValueAtTime(0,when);gn.gain.linearRampToValueAtTime(.03,when+2.8);gn.gain.setValueAtTime(.03,when+dur);gn.gain.linearRampToValueAtTime(0,when+dur+3.5);
    o.connect(lp);lp.connect(gn);gn.connect(AU.pad);o.start(when);o.stop(when+dur+3.7);});
}
const CHORDS=[[50,57,64,66,69],[47,54,62,64,69],[43,50,59,66,71],[45,52,57,64,73]];
const PROF=[{p:.3,lo:4,hi:10,dec:2.2},{p:.46,lo:5,hi:13,dec:2.8},{p:.26,lo:2,hi:9,dec:2},{p:.55,lo:9,hi:17,dec:3.8},{p:.36,lo:5,hi:12,dec:3.2}];
function tick(){
  const C=AU.C;if(C.state!=='running')return;
  const pr=PROF[mode==='end'?4:(LINES[Math.max(0,curLine)]||LINES[0]).si];
  while(AU.next<C.currentTime+.25){
    const s=AU.step,w=AU.next;
    if(s%16===0)padChord(CHORDS[(s/16)%4],w,7.6);
    if(Math.random()<pr.p){AU.mel+=[-2,-1,-1,1,1,2][(Math.random()*6)|0];AU.mel=Math.max(pr.lo,Math.min(pr.hi,AU.mel));
      bell(note(AU.mel),w+(Math.random()<.2?.25:0),rnd(.5,.9),pr.dec);
      if(pr===PROF[3]&&Math.random()<.3)bell(note(AU.mel+5),w+.12,.3,4.2);}
    AU.next+=.5;AU.step++;
  }
}
function plink(){if(!AU.on||AU.muted||!playing)return;const n=AU.C.currentTime;if(n-AU.lastPl<.4||Math.random()>.18)return;AU.lastPl=n;bell(note(11+((Math.random()*6)|0)),n+.01,.22,1.8);}

/* ---------- UI ---------- */
const cap=document.getElementById('cap'),chap=document.getElementById('chap'),prog=document.getElementById('prog');
function showLine(L){
  cap.classList.remove('on');
  setTimeout(()=>{cap.textContent='';L.tx.split('\n').forEach((t,i)=>{if(i)cap.appendChild(document.createElement('br'));cap.appendChild(document.createTextNode(t));});cap.classList.add('on');},reduce?0:650);
  chap.innerHTML='<b>'+NUM[L.si]+'</b>'+SCRIPT[L.si].name;
}
function showEnd(){cap.classList.remove('on');document.getElementById('end').classList.remove('gone');}
const iPlay=document.getElementById('iPlay'),iSnd=document.getElementById('iSnd');
function setPlayIcon(){iPlay.innerHTML=playing?'<path d="M9 6v12M15 6v12"/>':'<path d="M8 5.5v13l11-6.5z"/>';bPlay.setAttribute('aria-label',playing?'暫停':'播放');}
const bPlay=document.getElementById('bPlay');
document.getElementById('bStart').onclick=()=>{
  try{audioInit();}catch(e){}
  document.getElementById('intro').classList.add('gone');document.getElementById('ctrls').hidden=false;
  mode='play';T=0;curLine=-1;photoK=0;
};
bPlay.onclick=()=>{playing=!playing;setPlayIcon();if(AU.on)playing?AU.C.resume():AU.C.suspend();};
document.getElementById('bSnd').onclick=()=>{
  if(!AU.on)return;AU.muted=!AU.muted;AU.master.gain.setTargetAtTime(AU.muted?0:.9,AU.C.currentTime,.3);
  iSnd.innerHTML=AU.muted?'<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/>':'<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>';
  document.getElementById('bSnd').setAttribute('aria-label',AU.muted?'開啟聲音':'靜音');
};
function replay(){
  gx.clearRect(0,0,W,H);parts.length=0;snow.length=0;snowAcc=0;photoK=0;P.photo=0;
  strands.forEach(st=>st.beads.forEach(b=>{b.bloom=0;b.present=true;}));
  T=0;curLine=-1;mode='play';playing=true;setPlayIcon();if(AU.on)AU.C.resume();
  document.getElementById('end').classList.add('gone');cap.classList.remove('on');
}
document.getElementById('bRe').onclick=replay;document.getElementById('bAgain').onclick=replay;
cv.addEventListener('pointerdown',e=>{
  if(mode==='intro')return;const x=e.clientX;let c=0;
  for(const st of strands){if(Math.abs(st.ax-x)<60){st.shake=1;for(const b of st.beads)if(b.present&&b.bloom>.5&&Math.random()<.45&&c<7){drop(st,b,rnd(-20,20));c++;}}}
  ripples.push({x,y:Math.max(GT+8,Math.min(H-8,e.clientY)),r:2,life:1});
  if(AU.on&&!AU.muted){const n=AU.C.currentTime;[0,2,4].forEach((k,i)=>bell(note(AU.mel+k),n+i*.11,.5,2.6));}
});

addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,150);});
resize();
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);})(last);
})();
</script>
